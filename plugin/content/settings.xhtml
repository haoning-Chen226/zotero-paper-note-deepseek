<groupbox id="paper-note-deepseek-config"
          onload="ZoteroPaperNotePreferences.init(this, event)">
  <label><html:h2>DeepSeek 连接</html:h2></label>
  <html:div class="paper-note-deepseek-fields">
    <html:label for="paper-note-deepseek-url">API 地址</html:label>
    <html:input id="paper-note-deepseek-url" type="url" spellcheck="false"
                placeholder="https://api.deepseek.com" />
    <html:label for="paper-note-deepseek-model">模型</html:label>
    <html:input id="paper-note-deepseek-model" type="text" spellcheck="false"
                placeholder="deepseek-flash" />
    <html:label for="paper-note-deepseek-key">API 密钥</html:label>
    <html:input id="paper-note-deepseek-key" type="password" autocomplete="off"
                spellcheck="false" />
  </html:div>

  <label><html:h2>生成方式</html:h2></label>
  <html:label class="paper-note-deepseek-check">
    <html:input id="paper-note-deepseek-automatic" type="checkbox" />
    收藏新论文时自动生成子笔记
  </html:label>
  <html:label class="paper-note-deepseek-check">
    <html:input id="paper-note-deepseek-pdf" type="checkbox" />
    优先使用可读的本地 PDF 文本
  </html:label>
  <html:p class="paper-note-deepseek-info">
    生成时会向所填 API 地址发送论文元数据、摘要和已启用的 PDF 文本节选。仅测试连接时，会发送一条示例请求。已有条目可用右键菜单手动生成。
  </html:p>
  <html:div class="paper-note-deepseek-actions">
    <html:button id="paper-note-deepseek-save" type="button">保存设置</html:button>
    <html:button id="paper-note-deepseek-test" type="button">测试连接</html:button>
    <html:button id="paper-note-deepseek-remove" type="button">移除已保存的密钥</html:button>
  </html:div>
  <html:p id="paper-note-deepseek-status" role="status" aria-live="polite"></html:p>
</groupbox>
